{% for e in form.non_field_errors %}<div class="err">{{ e }}</div>{% endfor %}
{% for field in form.hidden_fields %}{{ field }}{% endfor %}
{% for field in form.visible_fields %}
  {% if field.name == "website" %}<div class="hp" aria-hidden="true"><label>Сайт {{ field }}</label></div>
  {% else %}{% include "partials/_field.html" %}{% endif %}
{% endfor %}
