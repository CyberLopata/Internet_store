<form class="fav" method="post" action="{% url 'favorite_toggle' pid %}">{% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  <button type="submit" class="fav-btn{% if pid in fav_ids %} on{% endif %}{% if label %} pdp{% endif %}" data-fav="{{ pid }}" aria-pressed="{% if pid in fav_ids %}true{% else %}false{% endif %}" aria-label="{% if pid in fav_ids %}Прибрати з обраного{% else %}Додати в обране{% endif %}" title="{% if pid in fav_ids %}Прибрати з обраного{% else %}Додати в обране{% endif %}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>{% if label %}<span class="fav-text" data-on="В обраному" data-off="В обране">{% if pid in fav_ids %}В обраному{% else %}В обране{% endif %}</span>{% endif %}</button>
</form>
